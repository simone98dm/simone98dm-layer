name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    # Skip the release commit changelogen pushes back to main, so a release
    # can never trigger another one.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"

    steps:
      - uses: actions/checkout@v5
        with:
          # changelogen reads the commits and tags since the last release.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@simone98dm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run test:types

      - name: Test
        run: npm run test

      # The layer ships raw sources, so building the playground is what proves
      # the layer actually compiles in a consuming project.
      - name: Build playground
        run: npm run dev:build

      # Derives the bump from the conventional commits merged since the last
      # tag: feat -> minor, fix/perf/refactor/docs -> patch, chore -> patch,
      # anything breaking -> major. Also writes CHANGELOG.md, commits and tags.
      - name: Bump version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx changelogen --release --push

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
