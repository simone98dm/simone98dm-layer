name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run test:types

      - name: Test
        run: npm run test

      # The layer ships raw sources, so building the playground is what proves
      # the layer actually compiles in a consuming project.
      - name: Build playground
        run: npm run dev:build
